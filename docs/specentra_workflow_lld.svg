<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #142033; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; fill: #526173; }
      .section-title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #142033; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #142033; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #526173; }
      .tiny { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; fill: #526173; }
      .mono { font-family: Consolas, JetBrains Mono, monospace; font-size: 11px; fill: #203047; }
      .panel { fill: #ffffff; stroke: #dfe7f1; stroke-width: 1.4; rx: 14; }
      .panel-dark { fill: #142033; stroke: #31445f; stroke-width: 1.4; rx: 14; }
      .panel-soft { fill: #e8f6f4; stroke: #b8ddd8; stroke-width: 1.3; rx: 12; }
      .card { fill: #ffffff; stroke: #c4d0df; stroke-width: 1.2; rx: 10; }
      .card-teal { fill: #e8f6f4; stroke: #0f766e; stroke-width: 1.2; rx: 10; }
      .card-blue { fill: #eef5ff; stroke: #2f63b7; stroke-width: 1.2; rx: 10; }
      .card-amber { fill: #fff5e6; stroke: #a66412; stroke-width: 1.2; rx: 10; }
      .card-red { fill: #fff0f3; stroke: #b4233a; stroke-width: 1.2; rx: 10; }
      .card-purple { fill: #f4f0fb; stroke: #7252a5; stroke-width: 1.2; rx: 10; }
      .dark-title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #ffffff; }
      .dark-small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #d8e4f2; }
      .chip { fill: #eef3f8; stroke: #c4d0df; stroke-width: 1; rx: 14; }
      .chip-text { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #526173; }
      .arrow { stroke: #526173; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-teal { stroke: #0f766e; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead-teal); }
      .arrow-amber { stroke: #a66412; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead-amber); }
      .dash { stroke-dasharray: 7 6; }
      .lane { fill: #ffffff; stroke: #dfe7f1; stroke-width: 1; rx: 16; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#526173"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a66412"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#142033" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1220"/>

  <text class="title" x="60" y="62">Specentra AI AuditOS - Workflow LLD Architecture</text>
  <text class="subtitle" x="60" y="92">Low-level workflow architecture for login, engagement setup, role assignment, sequential audit workflow, working papers, review notes, links, roll-forward, and archive controls.</text>

  <rect class="panel-dark" x="60" y="125" width="1680" height="82" filter="url(#shadow)"/>
  <text class="dark-title" x="90" y="160">Primary Actors</text>
  <text class="dark-small" x="90" y="184">Admin | Partner | Audit Manager | Reviewer | Preparer | EQCR | Client login</text>
  <rect class="chip" x="520" y="150" width="155" height="30"/>
  <text class="chip-text" x="546" y="169">Role based access</text>
  <rect class="chip" x="700" y="150" width="176" height="30"/>
  <text class="chip-text" x="724" y="169">Engagement scoping</text>
  <rect class="chip" x="902" y="150" width="180" height="30"/>
  <text class="chip-text" x="925" y="169">Audit trail events</text>
  <rect class="chip" x="1108" y="150" width="210" height="30"/>
  <text class="chip-text" x="1132" y="169">Document storage control</text>
  <rect class="chip" x="1344" y="150" width="210" height="30"/>
  <text class="chip-text" x="1368" y="169">AI-ready audit context</text>

  <!-- Application stack -->
  <rect class="lane" x="60" y="235" width="1680" height="160" filter="url(#shadow)"/>
  <text class="section-title" x="90" y="270">Application Stack</text>

  <rect class="card-teal" x="90" y="295" width="270" height="68"/>
  <text class="label" x="112" y="322">React + Vite Frontend</text>
  <text class="small" x="112" y="344">Login, Engagements, File Explorer, WP Panel</text>

  <rect class="card-blue" x="425" y="295" width="260" height="68"/>
  <text class="label" x="447" y="322">API Client</text>
  <text class="small" x="447" y="344">Axios + JWT bearer token</text>

  <rect class="card" x="750" y="295" width="300" height="68"/>
  <text class="label" x="772" y="322">FastAPI Backend</text>
  <text class="small" x="772" y="344">Auth, engagement, folders, WPs, users</text>

  <rect class="card-purple" x="1115" y="295" width="250" height="68"/>
  <text class="label" x="1137" y="322">SQLAlchemy Models</text>
  <text class="small" x="1137" y="344">Users, engagements, WPs, notes, links</text>

  <rect class="card-amber" x="1430" y="295" width="250" height="68"/>
  <text class="label" x="1452" y="322">Persistence Layer</text>
  <text class="small" x="1452" y="344">MySQL database + file storage</text>

  <path class="arrow-teal" d="M360 329 H425"/>
  <path class="arrow-teal" d="M685 329 H750"/>
  <path class="arrow-teal" d="M1050 329 H1115"/>
  <path class="arrow-teal" d="M1365 329 H1430"/>

  <!-- Workflow lanes -->
  <rect class="lane" x="60" y="430" width="520" height="650" filter="url(#shadow)"/>
  <text class="section-title" x="90" y="466">1. Engagement Setup Workflow</text>

  <rect class="card-teal" x="90" y="492" width="430" height="72"/>
  <text class="label" x="112" y="520">Login and Token Issue</text>
  <text class="small" x="112" y="542">User authenticates through /auth/login and receives JWT.</text>

  <rect class="card" x="90" y="595" width="430" height="88"/>
  <text class="label" x="112" y="623">Create Engagement</text>
  <text class="small" x="112" y="646">Client, financial year, engagement type, EQCR flag,</text>
  <text class="small" x="112" y="665">small/non-operational entity flag.</text>

  <rect class="card-blue" x="90" y="715" width="430" height="96"/>
  <text class="label" x="112" y="743">Auto Create Audit Structure</text>
  <text class="small" x="112" y="766">Sections: 1000, 2000, 3000, 4000, 5000, MISC.</text>
  <text class="small" x="112" y="785">Folder template varies by engagement type and small flag.</text>

  <rect class="card-purple" x="90" y="843" width="430" height="88"/>
  <text class="label" x="112" y="871">Assign Engagement Team</text>
  <text class="small" x="112" y="894">Admin/Partner/Manager assigns user as Preparer,</text>
  <text class="small" x="112" y="913">Reviewer, or EQCR for this engagement.</text>

  <rect class="card-amber" x="90" y="963" width="430" height="78"/>
  <text class="label" x="112" y="991">Event Log</text>
  <text class="small" x="112" y="1014">Every critical action emits audit trail event records.</text>

  <path class="arrow-teal" d="M305 564 V595"/>
  <path class="arrow-teal" d="M305 683 V715"/>
  <path class="arrow-teal" d="M305 811 V843"/>
  <path class="arrow-teal" d="M305 931 V963"/>

  <!-- Sequential workflow lane -->
  <rect class="lane" x="640" y="430" width="520" height="650" filter="url(#shadow)"/>
  <text class="section-title" x="670" y="466">2. Sequential Audit Workflow</text>

  <rect class="card-teal" x="670" y="493" width="430" height="66"/>
  <text class="label" x="692" y="520">1000 Preconditions</text>
  <text class="small" x="692" y="542">Open from engagement creation.</text>

  <rect class="card-blue" x="670" y="590" width="430" height="74"/>
  <text class="label" x="692" y="618">2000 Planning</text>
  <text class="small" x="692" y="641">Unlocked after mandatory 1000 folders contain WPs.</text>

  <rect class="card" x="670" y="695" width="430" height="72"/>
  <text class="label" x="692" y="723">3000 Communications</text>
  <text class="small" x="692" y="745">Open throughout the engagement lifecycle.</text>

  <rect class="card-amber" x="670" y="798" width="430" height="84"/>
  <text class="label" x="692" y="826">4000 Execution + 5000 Reporting</text>
  <text class="small" x="692" y="849">Unlocked after mandatory 2000 planning folders contain WPs.</text>
  <text class="small" x="692" y="868">Locked when archived.</text>

  <rect class="card-red" x="670" y="916" width="430" height="86"/>
  <text class="label" x="692" y="944">Partner/Admin Override</text>
  <text class="small" x="692" y="967">workflow_override bypasses sequential section locks.</text>
  <text class="small" x="692" y="986">Override is blocked after archive.</text>

  <path class="arrow-teal" d="M885 559 V590"/>
  <path class="arrow-teal" d="M885 664 V798"/>
  <path class="arrow" d="M885 767 V798"/>
  <path class="arrow-amber dash" d="M885 916 V882"/>

  <!-- WP lifecycle lane -->
  <rect class="lane" x="1220" y="430" width="520" height="650" filter="url(#shadow)"/>
  <text class="section-title" x="1250" y="466">3. Working Paper Lifecycle</text>

  <rect class="card-teal" x="1250" y="492" width="430" height="80"/>
  <text class="label" x="1272" y="520">Upload or Carry Forward WP</text>
  <text class="small" x="1272" y="543">Auto index from folder context; override for Manager+</text>
  <text class="small" x="1272" y="560">Initial preparer signoff uses user initials.</text>

  <rect class="card-blue" x="1250" y="602" width="430" height="74"/>
  <text class="label" x="1272" y="630">Submit for Review</text>
  <text class="small" x="1272" y="653">Only WP preparer can submit prepared document.</text>

  <rect class="card-red" x="1250" y="706" width="430" height="88"/>
  <text class="label" x="1272" y="734">Review Note Cycle</text>
  <text class="small" x="1272" y="757">Reviewer raises notes; preparer responds.</text>
  <text class="small" x="1272" y="776">Reviewer closes after re-review.</text>

  <rect class="card-purple" x="1250" y="824" width="430" height="80"/>
  <text class="label" x="1272" y="852">WP Links by Index</text>
  <text class="small" x="1272" y="875">Cross-reference another WP using target WP number.</text>
  <text class="small" x="1272" y="892">Links survive file replacement.</text>

  <rect class="card-amber" x="1250" y="934" width="430" height="88"/>
  <text class="label" x="1272" y="962">Finalise and Archive</text>
  <text class="small" x="1272" y="985">Finalise requires closed notes.</text>
  <text class="small" x="1272" y="1004">Archive makes engagement read-only.</text>

  <path class="arrow-teal" d="M1465 572 V602"/>
  <path class="arrow-teal" d="M1465 676 V706"/>
  <path class="arrow-teal" d="M1465 794 V824"/>
  <path class="arrow-teal" d="M1465 904 V934"/>

  <!-- Data model -->
  <rect class="lane" x="60" y="1110" width="1680" height="78" filter="url(#shadow)"/>
  <text class="section-title" x="90" y="1142">Core Data Model and Storage</text>
  <text class="mono" x="90" y="1168">users | engagement_users(role) | engagements(type, is_small_entity, workflow_override) | sections | folders | working_papers | file_versions | review_notes(response) | sign_offs | working_paper_links | event_logs</text>
  <text class="small" x="90" y="1188">Files are retained in server file storage; database stores metadata, version pointers, workflow status, signoffs, notes, and links.</text>

  <!-- Cross lane arrows -->
  <path class="arrow" d="M520 762 C585 762 605 762 670 762"/>
  <text class="tiny" x="548" y="746">folder structure</text>
  <path class="arrow" d="M1100 840 C1160 840 1190 840 1250 840"/>
  <text class="tiny" x="1132" y="822">lock status</text>
  <path class="arrow-amber dash" d="M1465 1022 C1465 1075 1290 1100 900 1110"/>
  <text class="tiny" x="1320" y="1088">archive/read-only rule</text>
</svg>
